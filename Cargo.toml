[package]
name = "pastor"
version = "0.1.0"
edition = "2021"
description = "Gestor de agentes de código (Claude Code, Codex, opencode) sobre tmux"
repository = "https://github.com/MiguelBriseno/pastor"
rust-version = "1.89"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
libc = "0.2"
